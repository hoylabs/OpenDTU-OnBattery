name: OpenDTU-OnBattery Build
# marks full pull request builds for the "Comment on pull request" workflow.
# evaluates to an empty string otherwise, which keeps the default run name.
run-name: ${{ contains(github.event.pull_request.labels.*.name, 'build-artifacts') && format('{0} [build-artifacts]', github.event.pull_request.title) || '' }}

on:
  push:
    paths-ignore:
      - docs/**
      - '**/*.md'
    branches:
      - master
      - development
    tags-ignore:
      - 'v**'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - docs/**
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# pull requests build a single environment as a compile check. the full set of
# environments (and the artifacts comment) is only built for pull requests
# labeled "build-artifacts", as well as for pushes, tags and manual runs.
concurrency:
  # adding an unrelated label must not cancel a running build
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'build-artifacts' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FULL_BUILD: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build-artifacts') }}

jobs:
  get_default_envs:
    name: Gather Environments
    runs-on: ubuntu-24.04
    if: github.event.action != 'labeled' || github.event.label.name == 'build-artifacts'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio intelhex

      - name: Get default environments
        id: envs
        run: |
          if [ "$FULL_BUILD" = "true" ]; then
            echo "environments=$(pio project config --json-output | jq -cr '.[1][1][0][1]|split(",")')" >> "$GITHUB_OUTPUT"
          else
            echo 'environments=["generic_esp32s3_usb"]' >> "$GITHUB_OUTPUT"
          fi

    outputs:
      environments: ${{ steps.envs.outputs.environments }}

  build:
    name: Build Environments
    runs-on: ubuntu-24.04
    needs: get_default_envs
    strategy:
      matrix:
        environment: ${{ fromJSON(needs.get_default_envs.outputs.environments) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get tags
        run: git fetch --force --tags origin

      - name: Create and switch to a meaningful branch for pull-requests
        if: github.event_name == 'pull_request'
        run: |
          OWNER=${{ github.repository_owner }}
          NAME=${{ github.event.repository.name }}
          ID=${{ github.event.pull_request.number }}
          DATE=$(date +'%Y%m%d%H%M')
          git switch -c ${OWNER}/${NAME}/pr${ID}-${DATE}

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          # there are no lockfiles: the platform and its packages are pinned
          # in platformio.ini, so a changed file stores a new cache. no
          # restore-keys on purpose: restoring an older cache would carry
          # outdated packages along, so the cache would grow with every
          # change. unused caches are evicted by GitHub after 7 days.
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio setuptools intelhex

      - name: Enable Corepack
        run: |
            cd webapp
            corepack enable

      - name: Setup Node.js and yarn
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "yarn"
          cache-dependency-path: "webapp/yarn.lock"

      - name: Install WebApp dependencies
        run: |
            cd webapp
            yarn install --frozen-lockfile

      - name: Build WebApp
        run: |
            cd webapp
            yarn build

      # pull requests only recompile what changed, starting from the build of
      # the latest push to development. branches, tags and manual runs always
      # build from scratch, and only pushes to development save the cache.
      # libraries are not cached, so pull requests fetch them like clean builds.
      - name: Restore build cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pio/build/project.checksum
            .pio/build/${{ matrix.environment }}
          key: pio-build-${{ matrix.environment }}-${{ github.sha }}
          restore-keys: |
            pio-build-${{ matrix.environment }}-

      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}

      - name: Save build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pio/build/project.checksum
            .pio/build/${{ matrix.environment }}
          key: pio-build-${{ matrix.environment }}-${{ github.sha }}

      - name: Rename Firmware
        run: mv .pio/build/${{ matrix.environment }}/firmware.bin .pio/build/${{ matrix.environment }}/opendtu-onbattery-${{ matrix.environment }}.bin

      - name: Rename Factory Firmware
        run: mv .pio/build/${{ matrix.environment }}/firmware.factory.bin .pio/build/${{ matrix.environment }}/opendtu-onbattery-${{ matrix.environment }}.factory.bin

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opendtu-onbattery-${{ matrix.environment }}
          path: |
            .pio/build/${{ matrix.environment }}/opendtu-onbattery-${{ matrix.environment }}.bin
            !.pio/build/generic_esp32_4mb_no_ota/opendtu-onbattery-generic_esp32_4mb_no_ota.bin
            .pio/build/${{ matrix.environment }}/opendtu-onbattery-${{ matrix.environment }}.factory.bin

  # keep only the newest build cache per environment, so the build caches
  # do not grow with every push
  prune_build_cache:
    name: Prune build caches
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete outdated build caches
        run: |
          gh cache list --key pio-build- --ref refs/heads/development --limit 100 \
            --json id,key,createdAt \
            --jq 'group_by(.key | sub("-[0-9a-f]{40}$"; "")) | map(sort_by(.createdAt) | .[:-1]) | flatten | .[].id' |
            xargs -r -n1 gh cache delete

  # This snippet is public-domain, taken from
  # https://github.com/oprypin/nightly.link/blob/master/.github/workflows/pr-comment.yml
  # and modified to store the comment as an artifact instead of posting it because
  # the action does not have sufficient permissions to post a comment when triggered
  # by a forked repository.
  # source: https://github.com/live-codes/pr-comment-from-artifact/blob/main/action.yml
  generate_pr_artifacts_comment:
    name: Generate PR artifacts comment and store it as artifact
    needs: build
    permissions:
      actions: read
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-artifacts')
    runs-on: ubuntu-24.04
    steps:
      - name: Generate PR artifacts comment
        id: generate_pr_artifacts_comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {owner, repo} = context.repo;

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner,
                repo,
                run_id: context.runId
              }
            );

            if (!artifacts.length) {
              return core.error(`No artifacts found`);
            }

            let body = `### Build Artifacts\n\nFirmware built from this pull request's code:\n`;
            for (const art of artifacts) {
              body += `\n* [${art.name}.zip](https://nightly.link/${owner}/${repo}/actions/artifacts/${art.id}.zip)`;
            }

            const build_run_url = `https://github.com/hoylabs/OpenDTU-OnBattery/actions/runs/${context.runId}`;

            body += `\n\n### Notice\n`
              + `* These artifacts are ZIP files containing the factory update binary as well as the OTA update binary.\n`
              + `  Extract the binaries from the ZIP files first. Do not use the ZIP files themselves to perform an update.\n`
              + `* These links point to artifacts of the latest [**successful** build run](${build_run_url}).\n`
              + `* The linked artifacts were built from ${context.sha}.`;
            core.setOutput("message", body);

      - name: Save output and PR number
        shell: bash
        run: |
          mkdir -p ./pr
          echo "${{ steps.generate_pr_artifacts_comment.outputs.message }}" > ./pr/${{ github.event.number }}.md

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr
          path: pr/
          retention-days: 1
          overwrite: true

  release:
    name: Create Release
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pull-requests: read
      contents: write
    needs: [get_default_envs, build]
    if: startsWith(github.ref, 'refs/tags/2')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get openDTU core tags
        run: git fetch --force --tags https://github.com/tbnobody/OpenDTU.git

      - name: Get openDTU core release
        run: |
          echo "OPEN_DTU_CORE_RELEASE=$(git for-each-ref --sort=creatordate --format '%(refname) %(creatordate)' refs/tags | grep 'refs/tags/v' | tail -1 | sed 's#.*/##' | sed 's/ .*//')" >> "$GITHUB_ENV"

      - name: Create openDTU-core-release-Badge
        if: vars.BADGE_GIST_ID != ''
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # version 1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.BADGE_GIST_ID }}
          filename: openDTUcoreRelease.json
          label: based on upstream OpenDTU
          message: ${{ env.OPEN_DTU_CORE_RELEASE }}
          color: lightblue

      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@aa013739bbc8e7067dbbecd4525ff11aeb51a84b # v6.4.0
        with:
          failOnError: true
          commitMode: true
          configuration: ".github/workflows/config/release-notes-config.json"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/

      - name: Move artifacts to the expected location
        run: |
          ls -lR artifacts/
          mkdir -p release-artifacts
          for i in artifacts/*/; do
            for file in "${i}"opendtu-onbattery-*.bin; do
              # only process if the file actually exists
              # (is not just a pattern that failed expansion)
              if [ -f "$file" ]; then
                filename=$(basename "${file}")
                tag_name=${GITHUB_REF#refs/tags/}
                # remove prefix "opendtu-onbattery-" from the filename
                new_filename="${filename#opendtu-onbattery-}"
                # insert the Git tag name after the common prefix
                new_filename="opendtu-onbattery-${tag_name}-${new_filename}"
                cp -v "${file}" "release-artifacts/${new_filename}"
              fi
            done
          done
          ls -lR release-artifacts/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ steps.github_release.outputs.changelog }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # re-run of this job: update the existing release, and publish it
            # in case an interrupted run left it as a draft
            gh release upload "$GITHUB_REF_NAME" release-artifacts/*.bin --clobber
            gh release edit "$GITHUB_REF_NAME" --notes "$NOTES" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" release-artifacts/*.bin \
              --title "$GITHUB_REF_NAME" --notes "$NOTES" --verify-tag
          fi
