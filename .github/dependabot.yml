version: 2
updates:
  # The webapp's npm dependencies follow upstream (tbnobody/OpenDTU merges).
  # A limit of 0 disables version updates, security updates are not affected.
  - package-ecosystem: "npm"
    directory: "/webapp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  # Also covers the OnBattery-only workflows, which upstream merges don't
  # update. One grouped pull request per month.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
